spring.application.name=fitfuel-backend
spring.datasource.url=jdbc:mysql://localhost:3306/fitfuel_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

jwt.secret=${JWT_SECRET}

nutrition.calorie-deficit=500
nutrition.calorie-surplus=300

nutrition.weight-loss.protein-per-kg=1.6
nutrition.weight-loss.fat-per-kg=0.8

nutrition.maintenance.protein-per-kg=1.2
nutrition.maintenance.fat-per-kg=0.8

nutrition.weight-gain.protein-per-kg=1.6
nutrition.weight-gain.fat-per-kg=0.9